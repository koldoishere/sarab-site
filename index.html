<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="icon" href="logo-mark.png" type="image/png">
<style>
  :root {
    --bg: #050706;
    --card: #0b100d;
    --border: #1a261e;
    --ink: #f5f8f6;
    --muted: #8d9891;
    --oasis: #20e070;
    --oasis-dim: #08783b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  body {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 2rem 1.25rem 3rem;
  }
  .card {
    width: min(36rem, 100%);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2.25rem 1.75rem 2rem;
    text-align: center;
  }
  .logo {
    width: 88px; height: 88px; border-radius: 18px;
    display: block; margin: 0 auto 1.1rem;
    border: 1px solid rgba(32, 224, 112, 0.28);
  }
  .wordmark {
    letter-spacing: 0.28em; font-weight: 700; font-size: 0.95rem;
    color: var(--ink); margin: 0 0 0.55rem;
  }
  h1 {
    margin: 0 0 0.85rem; font-size: clamp(1.55rem, 4vw, 1.9rem);
    font-weight: 600; line-height: 1.25; color: var(--ink);
  }
  .tagline { color: var(--oasis); font-weight: 600; }
  .blurb {
    margin: 0 auto 1.5rem; max-width: 28em;
    color: var(--muted); font-size: 1.02rem; line-height: 1.5;
  }
  .cta {
    display: flex; flex-direction: column; align-items: stretch; gap: 0.55rem;
    margin-bottom: 1.35rem;
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 2.85rem; padding: 0.7rem 1.25rem;
    border-radius: 12px; font-weight: 700; font-size: 1rem;
    text-decoration: none; color: #041008;
    background: var(--oasis);
    box-shadow: 0 8px 28px rgba(32, 224, 112, 0.22);
  }
  .btn:hover { filter: brightness(1.05); }
  .btn:focus-visible {
    outline: 3px solid var(--oasis); outline-offset: 3px;
  }
  .link-quiet {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 2.75rem; padding: 0.45rem 0.75rem;
    color: #c5d2cb; font-weight: 600; text-decoration: underline;
    text-underline-offset: 3px; border-radius: 8px;
  }
  .link-quiet:hover { color: var(--oasis); }
  .link-quiet:focus-visible {
    outline: 2px solid var(--oasis); outline-offset: 3px;
  }
  .also {
    margin: 0; padding-top: 1.1rem;
    border-top: 1px solid var(--border);
    color: var(--muted); font-size: 0.88rem; line-height: 1.55;
  }
  .also a { color: #c5d2cb; text-underline-offset: 2px; }
  .also a:hover { color: var(--oasis); }
  footer {
    margin-top: 1.75rem; font-size: 0.75rem; color: var(--muted);
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="logo-mark.png" width="88" height="88" alt="Sarab" decoding="async">
    <p class="wordmark">SARAB</p>
    <h1><span class="tagline">From mirage to water</span></h1>
    <p class="blurb">Digital products that ship — no fake earnings.</p>
    <div class="cta" role="region" aria-label="Primary actions">
      <a class="btn" href="https://koldoishere.github.io/sarab-rattib-funnel/bio.html">Get Rattib — start here</a>
      <a class="link-quiet" href="https://koldoishere.github.io/sarab-rattib-funnel/app/">Try the free web app</a>
    </div>
    <p class="also">
      Soft extras (optional):
      <a href="https://whop.com/3a4c1a95-1fd9-4864-9a4c-d293e48194f0/quoteforge-proposal-change-request-pack-for-freelancers/" target="_blank" rel="noopener noreferrer">QuoteForge</a>
      ·
      <a href="https://whop.com/3a4c1a95-1fd9-4864-9a4c-d293e48194f0/products/scopelock-kickoff-scope-control-pack-for-freelancers-devs/" target="_blank" rel="noopener noreferrer">ScopeLock</a>
    </p>
  </main>
  <footer>Sarab · indie digital products</footer>
</body>
</html>
